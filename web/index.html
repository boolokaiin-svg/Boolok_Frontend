<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-content" />
    <title>Boolok AI - AI Agent For Real Estate Services</title>
    <meta name="description" content="Boolok AI - Next-generation AI agent for real estate services, 3D architectural blueprints, deed verification, and social real estate network." />

    <!-- Webpage Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <style>
        /* ── Full-viewport reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            -webkit-overflow-scrolling: touch;
        }

        /* Expo mounts inside #root — force it to fill the full browser height */
        #root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Remove any UA default scrollbar gutter colour */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(218, 165, 32, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(218, 165, 32, 0.6);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <%- script %>
</body>

</html>
